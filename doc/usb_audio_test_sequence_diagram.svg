<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .actor-box { fill: #e6f3ff; stroke: #0066cc; stroke-width: 2; }
      .actor-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .lifeline { stroke: #666; stroke-width: 1; stroke-dasharray: 5,5; }
      .message { stroke: #333; stroke-width: 1.5; fill: none; }
      .message-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .activation { fill: #ffffcc; stroke: #ffcc00; stroke-width: 1; }
      .arrow { fill: #333; }
      .return-arrow { fill: #666; }
      .note { fill: #fff2cc; stroke: #d6b656; stroke-width: 1; }
      .note-text { font-family: Arial, sans-serif; font-size: 9px; text-anchor: start; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <text x="450" y="20" class="actor-text" font-size="16">USB音频测试系统时序图</text>
  
  <!-- 参与者 -->
  <rect x="30" y="40" width="80" height="30" class="actor-box"/>
  <text x="70" y="60" class="actor-text">用户</text>
  
  <rect x="150" y="40" width="100" height="30" class="actor-box"/>
  <text x="200" y="60" class="actor-text">主程序</text>
  
  <rect x="290" y="40" width="120" height="30" class="actor-box"/>
  <text x="350" y="60" class="actor-text">USBDeviceDetector</text>
  
  <rect x="450" y="40" width="120" height="30" class="actor-box"/>
  <text x="510" y="60" class="actor-text">AudioSignalGenerator</text>
  
  <rect x="610" y="40" width="120" height="30" class="actor-box"/>
  <text x="670" y="60" class="actor-text">USBAudioRecorder</text>
  
  <rect x="770" y="40" width="120" height="30" class="actor-box"/>
  <text x="830" y="60" class="actor-text">USBAudioPlayer</text>
  
  <!-- 生命线 -->
  <line x1="70" y1="70" x2="70" y2="680" class="lifeline"/>
  <line x1="200" y1="70" x2="200" y2="680" class="lifeline"/>
  <line x1="350" y1="70" x2="350" y2="680" class="lifeline"/>
  <line x1="510" y1="70" x2="510" y2="680" class="lifeline"/>
  <line x1="670" y1="70" x2="670" y2="680" class="lifeline"/>
  <line x1="830" y1="70" x2="830" y2="680" class="lifeline"/>
  
  <!-- 激活框 -->
  <rect x="195" y="100" width="10" height="560" class="activation"/>
  <rect x="345" y="130" width="10" height="80" class="activation"/>
  <rect x="505" y="250" width="10" height="60" class="activation"/>
  <rect x="825" y="340" width="10" height="60" class="activation"/>
  <rect x="665" y="430" width="10" height="80" class="activation"/>
  
  <!-- 消息序列 -->
  <!-- 1. 启动测试 -->
  <line x1="70" y1="100" x2="200" y2="100" class="message"/>
  <polygon points="200,100 195,95 195,105" class="arrow"/>
  <text x="135" y="95" class="message-text">启动测试</text>
  
  <!-- 2. 检测USB设备 -->
  <line x1="200" y1="130" x2="350" y2="130" class="message"/>
  <polygon points="350,130 345,125 345,135" class="arrow"/>
  <text x="275" y="125" class="message-text">detect_usb_audio_devices()</text>
  
  <!-- 3. 返回设备列表 -->
  <line x1="350" y1="160" x2="200" y2="160" class="message" stroke-dasharray="3,3"/>
  <polygon points="200,160 205,155 205,165" class="return-arrow"/>
  <text x="275" y="155" class="message-text">返回设备列表</text>
  
  <!-- 4. 获取设备能力 -->
  <line x1="200" y1="190" x2="350" y2="190" class="message"/>
  <polygon points="350,190 345,185 345,195" class="arrow"/>
  <text x="275" y="185" class="message-text">get_device_capabilities(device)</text>
  
  <!-- 5. 返回设备能力 -->
  <line x1="350" y1="210" x2="200" y2="210" class="message" stroke-dasharray="3,3"/>
  <polygon points="200,210 205,205 205,215" class="return-arrow"/>
  <text x="275" y="205" class="message-text">返回设备能力</text>
  
  <!-- 6. 生成测试信号 -->
  <line x1="200" y1="250" x2="510" y2="250" class="message"/>
  <polygon points="510,250 505,245 505,255" class="arrow"/>
  <text x="355" y="245" class="message-text">generate_test_tone(440Hz)</text>
  
  <!-- 7. 返回测试信号 -->
  <line x1="510" y1="280" x2="200" y2="280" class="message" stroke-dasharray="3,3"/>
  <polygon points="200,280 205,275 205,285" class="return-arrow"/>
  <text x="355" y="275" class="message-text">返回测试信号</text>
  
  <!-- 8. 播放测试信号 -->
  <line x1="200" y1="340" x2="830" y2="340" class="message"/>
  <polygon points="830,340 825,335 825,345" class="arrow"/>
  <text x="515" y="335" class="message-text">play_test_signal(signal, device)</text>
  
  <!-- 9. 播放完成 -->
  <line x1="830" y1="370" x2="200" y2="370" class="message" stroke-dasharray="3,3"/>
  <polygon points="200,370 205,365 205,375" class="return-arrow"/>
  <text x="515" y="365" class="message-text">播放完成</text>
  
  <!-- 10. 录音和质量分析 -->
  <line x1="200" y1="430" x2="670" y2="430" class="message"/>
  <polygon points="670,430 665,425 665,435" class="arrow"/>
  <text x="435" y="425" class="message-text">record_with_quality_analysis(device)</text>
  
  <!-- 11. 返回录音和质量指标 -->
  <line x1="670" y1="480" x2="200" y2="480" class="message" stroke-dasharray="3,3"/>
  <polygon points="200,480 205,475 205,485" class="return-arrow"/>
  <text x="435" y="475" class="message-text">返回录音和质量指标</text>
  
  <!-- 12. 保存测试结果 -->
  <line x1="200" y1="520" x2="200" y2="540" class="message"/>
  <polygon points="200,540 195,535 205,535" class="arrow"/>
  <text x="250" y="535" class="message-text">save_test_results(results)</text>
  
  <!-- 13. 生成测试报告 -->
  <line x1="200" y1="580" x2="200" y2="600" class="message"/>
  <polygon points="200,600 195,595 205,595" class="arrow"/>
  <text x="250" y="595" class="message-text">generate_comprehensive_report()</text>
  
  <!-- 14. 返回测试报告 -->
  <line x1="200" y1="640" x2="70" y2="640" class="message" stroke-dasharray="3,3"/>
  <polygon points="70,640 75,635 75,645" class="return-arrow"/>
  <text x="135" y="635" class="message-text">返回测试报告</text>
  
  <!-- 注释框 -->
  <rect x="20" y="300" width="120" height="60" class="note"/>
  <text x="25" y="315" class="note-text">循环处理每个</text>
  <text x="25" y="330" class="note-text">检测到的USB</text>
  <text x="25" y="345" class="note-text">音频设备</text>
  
  <rect x="750" y="400" width="120" height="60" class="note"/>
  <text x="755" y="415" class="note-text">质量分析包括:</text>
  <text x="755" y="430" class="note-text">- SNR计算</text>
  <text x="755" y="445" class="note-text">- THD分析</text>
  <text x="755" y="460" class="note-text">- 频率响应</text>
  
  <!-- 循环框 -->
  <rect x="15" y="220" width="860" height="280" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="20" y="235" class="note-text" font-weight="bold">loop [对每个设备]</text>
</svg>