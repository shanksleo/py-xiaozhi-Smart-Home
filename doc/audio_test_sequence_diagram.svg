<svg width="1400" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: Arial, sans-serif; font-size: 9px; fill: #7f8c8d; }
      .actor-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .lifeline { stroke: #bdc3c7; stroke-width: 2; stroke-dasharray: 5,5; }
      .activation { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 1; }
      .message { stroke: #2c3e50; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .return-message { stroke: #27ae60; stroke-width: 1; fill: none; marker-end: url(#return-arrow); stroke-dasharray: 3,3; }
      .self-message { stroke: #e67e22; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .note { fill: #f39c12; stroke: #e67e22; stroke-width: 1; }
      .error-message { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
    <marker id="return-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" class="title">音频扬声器测试系统时序图</text>
  <text x="700" y="50" text-anchor="middle" class="subtitle">Audio Speaker Test System Sequence Diagram</text>
  
  <!-- Actors -->
  <rect x="50" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="100" y="105" text-anchor="middle" class="text" fill="white">用户/测试框架</text>
  <text x="100" y="115" text-anchor="middle" class="small-text" fill="white">User/TestFramework</text>
  
  <rect x="200" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="250" y="100" text-anchor="middle" class="text" fill="white">主程序</text>
  <text x="250" y="115" text-anchor="middle" class="small-text" fill="white">main()</text>
  
  <rect x="350" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="400" y="100" text-anchor="middle" class="text" fill="white">音频生成器</text>
  <text x="400" y="115" text-anchor="middle" class="small-text" fill="white">AudioGenerator</text>
  
  <rect x="500" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="550" y="100" text-anchor="middle" class="text" fill="white">文件管理器</text>
  <text x="550" y="115" text-anchor="middle" class="small-text" fill="white">FileManager</text>
  
  <rect x="650" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="700" y="100" text-anchor="middle" class="text" fill="white">音频播放器</text>
  <text x="700" y="115" text-anchor="middle" class="small-text" fill="white">AudioPlayer</text>
  
  <rect x="800" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="850" y="100" text-anchor="middle" class="text" fill="white">设备接口</text>
  <text x="850" y="115" text-anchor="middle" class="small-text" fill="white">SoundDevice</text>
  
  <rect x="950" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="1000" y="100" text-anchor="middle" class="text" fill="white">日志系统</text>
  <text x="1000" y="115" text-anchor="middle" class="small-text" fill="white">Logger</text>
  
  <rect x="1100" y="80" width="100" height="40" rx="5" class="actor-box"/>
  <text x="1150" y="100" text-anchor="middle" class="text" fill="white">测试框架</text>
  <text x="1150" y="115" text-anchor="middle" class="small-text" fill="white">unittest</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="120" x2="100" y2="1150" class="lifeline"/>
  <line x1="250" y1="120" x2="250" y2="1150" class="lifeline"/>
  <line x1="400" y1="120" x2="400" y2="1150" class="lifeline"/>
  <line x1="550" y1="120" x2="550" y2="1150" class="lifeline"/>
  <line x1="700" y1="120" x2="700" y2="1150" class="lifeline"/>
  <line x1="850" y1="120" x2="850" y2="1150" class="lifeline"/>
  <line x1="1000" y1="120" x2="1000" y2="1150" class="lifeline"/>
  <line x1="1150" y1="120" x2="1150" y2="1150" class="lifeline"/>
  
  <!-- Activation boxes -->
  <rect x="245" y="160" width="10" height="980" class="activation"/>
  <rect x="395" y="220" width="10" height="200" class="activation"/>
  <rect x="545" y="280" width="10" height="140" class="activation"/>
  <rect x="695" y="460" width="10" height="300" class="activation"/>
  <rect x="845" y="500" width="10" height="100" class="activation"/>
  <rect x="995" y="140" width="10" height="1000" class="activation"/>
  <rect x="1145" y="800" width="10" height="200" class="activation"/>
  
  <!-- Messages -->
  
  <!-- 1. 初始化阶段 -->
  <line x1="100" y1="160" x2="250" y2="160" class="message"/>
  <text x="175" y="155" text-anchor="middle" class="text">1. 启动测试程序</text>
  
  <line x1="250" y1="180" x2="1000" y2="180" class="message"/>
  <text x="625" y="175" text-anchor="middle" class="text">2. setup_logging()</text>
  
  <line x1="1000" y1="200" x2="250" y2="200" class="return-message"/>
  <text x="625" y="195" text-anchor="middle" class="small-text">logger实例</text>
  
  <!-- 2. 音频生成阶段 -->
  <line x1="250" y1="220" x2="400" y2="220" class="message"/>
  <text x="325" y="215" text-anchor="middle" class="text">3. AudioGenerator()</text>
  
  <line x1="400" y1="240" x2="1000" y2="240" class="message"/>
  <text x="700" y="235" text-anchor="middle" class="text">4. 记录初始化日志</text>
  
  <!-- Self message for audio generation -->
  <path d="M 400 260 L 420 260 L 420 280 L 400 280" class="self-message"/>
  <text x="440" y="270" class="text">5. generate_sine_wave(440, 2.0)</text>
  
  <line x1="400" y1="300" x2="1000" y2="300" class="message"/>
  <text x="700" y="295" text-anchor="middle" class="text">6. 记录音频生成日志</text>
  
  <line x1="400" y1="320" x2="250" y2="320" class="return-message"/>
  <text x="325" y="315" text-anchor="middle" class="small-text">numpy音频数据</text>
  
  <!-- 3. 文件保存阶段 -->
  <line x1="250" y1="340" x2="550" y2="340" class="message"/>
  <text x="400" y="335" text-anchor="middle" class="text">7. FileManager()</text>
  
  <line x1="250" y1="360" x2="550" y2="360" class="message"/>
  <text x="400" y="355" text-anchor="middle" class="text">8. save_audio_to_wav(data, filename)</text>
  
  <line x1="550" y1="380" x2="1000" y2="380" class="message"/>
  <text x="775" y="375" text-anchor="middle" class="text">9. 记录文件保存日志</text>
  
  <line x1="550" y1="400" x2="250" y2="400" class="return-message"/>
  <text x="400" y="395" text-anchor="middle" class="small-text">文件路径</text>
  
  <!-- 4. 设备检测阶段 -->
  <line x1="250" y1="460" x2="700" y2="460" class="message"/>
  <text x="475" y="455" text-anchor="middle" class="text">10. AudioPlayer()</text>
  
  <line x1="700" y1="480" x2="850" y2="480" class="message"/>
  <text x="775" y="475" text-anchor="middle" class="text">11. query_devices()</text>
  
  <line x1="850" y1="500" x2="1000" y2="500" class="message"/>
  <text x="925" y="495" text-anchor="middle" class="text">12. 记录设备信息</text>
  
  <line x1="850" y1="520" x2="700" y2="520" class="return-message"/>
  <text x="775" y="515" text-anchor="middle" class="small-text">设备列表</text>
  
  <line x1="700" y1="540" x2="250" y2="540" class="return-message"/>
  <text x="475" y="535" text-anchor="middle" class="small-text">可用设备信息</text>
  
  <!-- 5. 音频播放阶段 -->
  <line x1="250" y1="580" x2="700" y2="580" class="message"/>
  <text x="475" y="575" text-anchor="middle" class="text">13. play_audio_data(audio_data, sample_rate)</text>
  
  <line x1="700" y1="600" x2="850" y2="600" class="message"/>
  <text x="775" y="595" text-anchor="middle" class="text">14. sd.play()</text>
  
  <line x1="700" y1="620" x2="1000" y2="620" class="message"/>
  <text x="850" y="615" text-anchor="middle" class="text">15. 记录播放开始</text>
  
  <!-- Note for playback -->
  <rect x="760" y="640" width="180" height="40" rx="5" class="note"/>
  <text x="850" y="655" text-anchor="middle" class="small-text">音频播放过程</text>
  <text x="850" y="670" text-anchor="middle" class="small-text">(阻塞或非阻塞模式)</text>
  
  <line x1="700" y1="700" x2="1000" y2="700" class="message"/>
  <text x="850" y="695" text-anchor="middle" class="text">16. 记录播放完成</text>
  
  <line x1="700" y1="720" x2="250" y2="720" class="return-message"/>
  <text x="475" y="715" text-anchor="middle" class="small-text">播放结果(True/False)</text>
  
  <!-- 6. 单元测试阶段 -->
  <line x1="250" y1="760" x2="1150" y2="760" class="message"/>
  <text x="700" y="755" text-anchor="middle" class="text">17. unittest.main()</text>
  
  <line x1="1150" y1="780" x2="250" y2="780" class="message"/>
  <text x="700" y="775" text-anchor="middle" class="text">18. 运行测试用例</text>
  
  <!-- Test case execution -->
  <rect x="1050" y="800" width="200" height="80" rx="5" class="note"/>
  <text x="1150" y="820" text-anchor="middle" class="small-text">测试用例执行:</text>
  <text x="1150" y="835" text-anchor="middle" class="small-text">• test_device_detection</text>
  <text x="1150" y="850" text-anchor="middle" class="small-text">• test_sine_wave_generation</text>
  <text x="1150" y="865" text-anchor="middle" class="small-text">• test_audio_playback</text>
  
  <line x1="1150" y1="900" x2="1000" y2="900" class="message"/>
  <text x="1075" y="895" text-anchor="middle" class="text">19. 记录测试结果</text>
  
  <line x1="1150" y1="920" x2="250" y2="920" class="return-message"/>
  <text x="700" y="915" text-anchor="middle" class="small-text">测试报告</text>
  
  <!-- 7. 交互式验证阶段 -->
  <line x1="250" y1="960" x2="100" y2="960" class="message"/>
  <text x="175" y="955" text-anchor="middle" class="text">20. 请求用户确认</text>
  
  <line x1="100" y1="980" x2="250" y2="980" class="return-message"/>
  <text x="175" y="975" text-anchor="middle" class="small-text">用户反馈(y/n)</text>
  
  <!-- 8. 清理阶段 -->
  <line x1="250" y1="1020" x2="550" y2="1020" class="message"/>
  <text x="400" y="1015" text-anchor="middle" class="text">21. cleanup_test_files()</text>
  
  <line x1="250" y1="1040" x2="700" y2="1040" class="message"/>
  <text x="475" y="1035" text-anchor="middle" class="text">22. stop_playback()</text>
  
  <line x1="250" y1="1060" x2="1000" y2="1060" class="message"/>
  <text x="625" y="1055" text-anchor="middle" class="text">23. 记录测试完成</text>
  
  <!-- 9. 结果返回 -->
  <line x1="250" y1="1100" x2="100" y2="1100" class="return-message"/>
  <text x="175" y="1095" text-anchor="middle" class="text">24. 返回测试结果</text>
  
  <!-- Error handling example -->
  <rect x="50" y="1120" width="300" height="60" rx="5" class="note"/>
  <text x="200" y="1140" text-anchor="middle" class="small-text">错误处理示例:</text>
  <text x="200" y="1155" text-anchor="middle" class="small-text">• 设备不可用 → 记录错误日志</text>
  <text x="200" y="1170" text-anchor="middle" class="small-text">• 播放失败 → 异常处理和清理</text>
  
  <!-- Time indicators -->
  <text x="20" y="160" class="small-text">t1</text>
  <text x="20" y="220" class="small-text">t2</text>
  <text x="20" y="340" class="small-text">t3</text>
  <text x="20" y="460" class="small-text">t4</text>
  <text x="20" y="580" class="small-text">t5</text>
  <text x="20" y="760" class="small-text">t6</text>
  <text x="20" y="960" class="small-text">t7</text>
  <text x="20" y="1020" class="small-text">t8</text>
  
  <!-- Phase labels -->
  <rect x="1250" y="140" width="120" height="30" rx="3" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="1310" y="160" text-anchor="middle" class="small-text">初始化阶段</text>
  
  <rect x="1250" y="200" width="120" height="30" rx="3" fill="#d5dbdb" stroke="#bdc3c7"/>
  <text x="1310" y="220" text-anchor="middle" class="small-text">音频生成阶段</text>
  
  <rect x="1250" y="320" width="120" height="30" rx="3" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="1310" y="340" text-anchor="middle" class="small-text">文件保存阶段</text>
  
  <rect x="1250" y="440" width="120" height="30" rx="3" fill="#d5dbdb" stroke="#bdc3c7"/>
  <text x="1310" y="460" text-anchor="middle" class="small-text">设备检测阶段</text>
  
  <rect x="1250" y="560" width="120" height="30" rx="3" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="1310" y="580" text-anchor="middle" class="small-text">音频播放阶段</text>
  
  <rect x="1250" y="740" width="120" height="30" rx="3" fill="#d5dbdb" stroke="#bdc3c7"/>
  <text x="1310" y="760" text-anchor="middle" class="small-text">单元测试阶段</text>
  
  <rect x="1250" y="940" width="120" height="30" rx="3" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="1310" y="960" text-anchor="middle" class="small-text">交互验证阶段</text>
  
  <rect x="1250" y="1000" width="120" height="30" rx="3" fill="#d5dbdb" stroke="#bdc3c7"/>
  <text x="1310" y="1020" text-anchor="middle" class="small-text">清理阶段</text>
</svg>